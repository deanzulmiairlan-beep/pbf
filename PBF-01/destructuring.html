<!-- Menentukan bahwa dokumen menggunakan HTML5 -->
<!DOCTYPE html>

<!-- Membuka dokumen HTML -->
<html>

<!-- Bagian head berisi pengaturan halaman -->
<head>

  <!-- Mengatur format karakter menggunakan UTF-8 -->
  <meta charset="utf-8">

  <!-- Mengatur tampilan agar responsif di berbagai ukuran layar -->
  <meta name="viewport" content="width=device-width">

  <!-- Menentukan judul halaman yang tampil pada tab browser -->
  <title>Destructuring</title>

  <!-- Menghubungkan halaman HTML dengan file CSS bernama style.css -->
  <link href="style.css" rel="stylesheet" type="text/css" />

<!-- Menutup bagian head -->
</head>

<!-- Bagian body berisi isi halaman -->
<body>

  <!-- Membuat paragraf kosong dengan id demo -->
  <p id="demo"></p>

  <!-- Memanggil file JavaScript destructuring.js -->
  <script src="destructuring.js"></script>

  <!--
  Script berikut digunakan untuk menampilkan badge Replit.
  Warna tema badge dapat diubah sesuai pilihan.
  -->

  <!-- Memanggil script Replit Badge dengan tema warna biru -->
  <script src="https://replit.com/public/js/replit-badge.js" theme="blue" defer></script>

<!-- Menutup bagian body -->
</body>

<!-- Menutup dokumen HTML -->
</html>
