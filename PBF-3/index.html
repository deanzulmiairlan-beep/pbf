<!-- Menentukan bahwa dokumen menggunakan HTML5 -->
<!DOCTYPE html>

<!-- Membuka dokumen HTML dan menentukan bahasa halaman menggunakan bahasa Inggris -->
<html lang="en">

  <!-- Bagian head berisi informasi dan pengaturan halaman -->
  <head>

    <!-- Mengatur format karakter menggunakan UTF-8 -->
    <meta charset="UTF-8" />

    <!-- Menentukan favicon atau ikon yang tampil pada tab browser -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mengatur tampilan agar responsif di berbagai ukuran layar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Menentukan judul halaman yang tampil pada tab browser -->
    <title>React + TypeScript + Replit</title>

  <!-- Menutup bagian head -->
  </head>

  <!-- Bagian body berisi isi halaman -->
  <body>

    <!-- Membuat elemen dengan id root sebagai tempat aplikasi React ditampilkan -->
    <div id="root"></div>

    <!-- Memanggil file index.jsx sebagai file utama aplikasi React -->
    <script type="module" src="/src/index.jsx"></script>
		
    <!--
    Script berikut digunakan untuk menampilkan badge Replit.
    Badge dapat muncul pada tampilan full-browser dan mengarah ke halaman project Replit.
    Tema warna badge dapat diubah sesuai pilihan.
    -->

    <!-- Memanggil script Replit Badge dengan tema warna biru -->
    <script src="https://replit.com/public/js/replit-badge.js" theme="blue" defer></script>

  <!-- Menutup bagian body -->
  </body>

<!-- Menutup dokumen HTML -->
</html>
