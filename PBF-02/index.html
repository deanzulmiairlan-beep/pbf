<!-- Menentukan bahwa dokumen menggunakan HTML5 -->
<!DOCTYPE html>

<!-- Membuka dokumen HTML -->
<html>

<!-- Bagian head berisi pengaturan halaman -->
<head>

  <!-- Mengatur format karakter menggunakan UTF-8 -->
  <meta charset="UTF-8" />

  <!-- Menentukan judul halaman yang tampil di tab browser -->
  <title>Hello World</title>

  <!-- Memanggil library React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

  <!-- Memanggil ReactDOM untuk menampilkan React ke halaman HTML -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!--
  Memanggil Babel untuk menerjemahkan kode JSX.
  Digunakan untuk pengembangan, bukan untuk production.
  -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Menutup bagian head -->
</head>

<!-- Bagian body berisi isi halaman -->
<body>

  <!-- Membuat elemen dengan id root sebagai tempat menampilkan aplikasi React -->
  <div id="root"></div>

  <!-- Menjalankan JavaScript yang menggunakan Babel/JSX -->
  <script type="text/babel">

    // Membuat komponen React bernama MyApp
    function MyApp() {

      // Menampilkan teks Hello, world! dalam elemen h1
      return <h1>Hello, world!</h1>;
    }

    // Mengambil elemen HTML yang memiliki id root
    const container = document.getElementById('root');

    // Membuat root React pada elemen container
    const root = ReactDOM.createRoot(container);

    // Menampilkan komponen MyApp ke dalam halaman
    root.render(<MyApp />);

  // Menutup script Babel
  </script>

  <!-- Memanggil script untuk menampilkan badge Replit -->
  <script src="https://replit.com/public/js/replit-badge.js" theme="blue" defer></script>

<!-- Menutup bagian body -->
</body>

<!-- Menutup dokumen HTML -->
</html>
