<!-- Menentukan bahwa dokumen menggunakan standar HTML5 -->
<!DOCTYPE html>

<!-- Membuka dokumen HTML dan menentukan bahasa halaman menggunakan bahasa Inggris -->
<html lang="en">

  <!-- Bagian head berisi informasi dan pengaturan halaman -->
  <head>

    <!-- Mengatur karakter teks menggunakan UTF-8 -->
    <meta charset="UTF-8" />

    <!-- Menentukan favicon atau ikon yang tampil pada tab browser -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mengatur tampilan agar responsif pada berbagai ukuran layar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Menentukan judul halaman yang tampil pada tab browser -->
    <title>React + TypeScript + Replit</title>

  </head>

  <!-- Bagian body berisi konten yang ditampilkan pada halaman -->
  <body>

    <!-- Membuat elemen root sebagai tempat aplikasi React ditampilkan -->
    <div id="root"></div>

    <!-- Memanggil file index.jsx sebagai file utama aplikasi React -->
    <!-- type="module" digunakan agar file dapat menggunakan import dan export -->
    <script type="module" src="/src/index.jsx"></script>

    <!--
    Script berikut digunakan untuk menampilkan badge Replit.
    Badge dapat mengarahkan pengguna kembali ke halaman project Replit.
    Tema warna badge dapat diubah sesuai pilihan.
    -->

    <!-- Memanggil script Replit Badge dengan tema warna biru -->
    <!-- defer membuat script dijalankan setelah halaman HTML selesai diproses -->
    <script src="https://replit.com/public/js/replit-badge.js" theme="blue" defer></script>

  </body>

<!-- Menutup dokumen HTML -->
</html>
